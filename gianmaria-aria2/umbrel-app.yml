manifestVersion: 1
id: gianmaria-aria2
category: files
name: aria2
version: "1.4.2"
tagline: Download manager con interfaccia minimale
description: >-
  aria2 è un download manager leggero e velocissimo, con una semplice interfaccia web.


  Supporta HTTP, HTTPS, FTP, SFTP, BitTorrent, magnet link e Metalink, con download multi-connessione.


  I file vengono salvati nella cartella Downloads di umbrelOS.


  Incolla link o magnet, oppure carica un file .torrent o una playlist .m3u (convertita in mp4): nessuna configurazione necessaria. Al primo avvio vengono scaricati aria2 e ffmpeg, quindi serve connessione a internet.
releaseNotes: >-
  Scheda M3U: tempo stimato di conversione più stabile e preciso.
