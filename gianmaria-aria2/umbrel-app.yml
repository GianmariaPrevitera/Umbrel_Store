manifestVersion: 1
id: gianmaria-aria2
category: files
name: aria2
version: "1.3.0"
tagline: Download manager con interfaccia minimale
description: >-
  aria2 è un download manager leggero e velocissimo, con una semplice interfaccia web.


  Supporta HTTP, HTTPS, FTP, SFTP, BitTorrent, magnet link e Metalink, con download multi-connessione.


  I file vengono salvati nella cartella Downloads di umbrelOS.


  Incolla link o magnet, oppure carica un file .torrent: nessuna configurazione necessaria. Al primo avvio viene scaricato aria2, quindi serve connessione a internet.
releaseNotes: >-
  Nuova interfaccia minimale inclusa nell'app, al posto di Aria2 WebUI. Corretto l'indirizzo dell'icona (branch master).
developer: Gianmaria
website: https://aria2.github.io
