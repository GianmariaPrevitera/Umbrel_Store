version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gianmaria-aria2_webui_1
      APP_PORT: 80

  aria2:
    image: p3terx/aria2-pro:202209060423
    restart: on-failure
    environment:
      PUID: 1000
      PGID: 1000
      UMASK_SET: "022"
      RPC_SECRET: ${APP_PASSWORD}
      RPC_PORT: 6800
      LISTEN_PORT: 6888
      DISK_CACHE: 64M
      IPV6_MODE: "false"
    ports:
      # RPC: Aria2 WebUI gira nel browser e si collega direttamente qui (protetto da RPC_SECRET)
      - "6800:6800"
      # BitTorrent / DHT
      - "6888:6888"
      - "6888:6888/udp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads

  webui:
    # Aria2 WebUI (ziahamza/webui-aria2): sito statico, scaricato al primo avvio
    # e salvato in ${APP_DATA_DIR}/data/webui
    image: nginx:1.27-alpine
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /usr/share/nginx/html/index.html ]; then
          apk add --no-cache curl >/dev/null
          mkdir -p /tmp/w
          curl -fsSL https://github.com/ziahamza/webui-aria2/archive/refs/heads/master.tar.gz | tar xz -C /tmp/w
          cp -r /tmp/w/webui-aria2-master/docs/. /usr/share/nginx/html/
          rm -rf /tmp/w
        fi
        exec nginx -g "daemon off;"
    volumes:
      - ${APP_DATA_DIR}/data/webui:/usr/share/nginx/html
