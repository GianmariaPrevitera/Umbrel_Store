version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gianmaria-aria2_webui_1
      APP_PORT: 80

  aria2:
    # aria2 ufficiale (pacchetto Alpine), avviato con listener RPC e BitTorrent espliciti
    image: alpine:3.20
    restart: on-failure
    environment:
      RPC_SECRET: ${APP_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache aria2 su-exec >/dev/null
        mkdir -p /config /downloads
        touch /config/aria2.session
        chown 1000:1000 /config /config/aria2.session
        exec su-exec 1000:1000 aria2c \
          --enable-rpc=true \
          --rpc-listen-all=true \
          --rpc-allow-origin-all=true \
          --rpc-listen-port=6800 \
          --rpc-secret="$$RPC_SECRET" \
          --listen-port=6888 \
          --dht-listen-port=6888 \
          --enable-dht=true \
          --dht-file-path=/config/dht.dat \
          --dir=/downloads \
          --input-file=/config/aria2.session \
          --save-session=/config/aria2.session \
          --save-session-interval=30 \
          --continue=true \
          --max-concurrent-downloads=5 \
          --max-connection-per-server=16 \
          --split=16 \
          --min-split-size=1M \
          --file-allocation=none \
          --bt-save-metadata=true \
          --seed-ratio=1.0 \
          --disable-ipv6=true \
          --console-log-level=notice
    ports:
      # BitTorrent / DHT
      - "6888:6888"
      - "6888:6888/udp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads

  webui:
    # Interfaccia web minimale inclusa nell'app (cartella webui/); /jsonrpc è inoltrato ad aria2
    image: nginx:1.27-alpine
    restart: on-failure
    environment:
      RPC_SECRET: ${APP_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "window.ARIA2_SECRET='$$RPC_SECRET';" > /usr/share/nginx/html/config.js
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          resolver 127.0.0.11 valid=10s;
          location = /config.js {
            add_header Cache-Control "no-store";
          }
          location = /jsonrpc {
            set $$aria2 "http://gianmaria-aria2_aria2_1:6800/jsonrpc";
            proxy_pass $$aria2;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$host;
            proxy_read_timeout 3600s;
          }
        }
        CONF
        exec nginx -g "daemon off;"
    volumes:
      - ${APP_DATA_DIR}/webui:/usr/share/nginx/html
