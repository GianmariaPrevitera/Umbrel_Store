manifestVersion: 1
id: gianmaria-url-follower
name: URL Follower
tagline: Tieni d'occhio i tuoi indirizzi e scopri quali sono online
icon: https://raw.githubusercontent.com/GianmariaPrevitera/Umbrel_Store/master/gianmaria-url-follower/icon.svg
category: Development
version: "0.3.0"
port: 4001
description: >-
  Controlla periodicamente un elenco di indirizzi web, segue i reindirizzamenti
  e salva la destinazione finale. Con una chiave API personale, all'indirizzo
  /api=<chiave> ottieni in testo semplice l'elenco degli indirizzi online.


  Si apre direttamente sul pannello di gestione di indirizzi e utenti. Per
  entrare usa la password mostrata da Umbrel tra le credenziali dell'app.

developer: Gianmaria Previtera
website: https://github.com/GianmariaPrevitera/Umbrel_Store
submitter: Gianmaria Previtera
submission: https://github.com/GianmariaPrevitera/Umbrel_Store
repo: https://github.com/GianmariaPrevitera/Umbrel_Store
support: https://github.com/GianmariaPrevitera/Umbrel_Store/issues
gallery:
  - https://i.imgur.com/yyVG0Jb.jpeg
  - https://i.imgur.com/yyVG0Jb.jpeg
  - https://i.imgur.com/yyVG0Jb.jpeg
releaseNotes: >-
  La pagina principale è ora il pannello di gestione. La password di accesso è
  quella mostrata da Umbrel tra le credenziali dell'app.
dependencies: []
path: ""
defaultUsername: "Admin"
defaultPassword: ""