<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Follower</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23066FD1'/%3E%3Cpath d='M9 22 L16 16 L23 10' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='22' r='3' fill='white'/%3E%3Ccircle cx='23' cy='10' r='3.5' fill='%23F59F00'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #F6F8FB;
      --surface: #FFFFFF;
      --text: #182433;
      --muted: #667382;
      --border: #E6E7E9;
      --primary: #066FD1;
      --primary-fg: #FFFFFF;
      --green: #2FB344;
      --red: #D63939;
      --grey: #667382;
      --hover: #F6F8FB;
      --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151F2C;
        --surface: #182433;
        --text: #DCE1E7;
        --muted: #9AA7B6;
        --border: #243245;
        --primary: #3B93E8;
        --hover: #1C2B3D;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 .875rem/1.5 var(--font); }

    /* Barra superiore */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 1140px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .topbar svg { width: 28px; height: 28px; }
    .topbar strong { font-size: 1rem; }
    .version { margin-left: auto; color: var(--muted); font-size: .75rem; }

    .container { max-width: 1140px; margin: 0 auto; padding: 24px 16px 48px; }

    /* Card */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 0 4px rgba(24,36,51,.04); }
    .card-header { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .card-title { margin: 0; font-size: 1rem; font-weight: 600; }
    .card-actions { margin-left: auto; }
    .btn-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-list.nowrap { flex-wrap: nowrap; }

    /* Pulsanti */
    .btn {
      display: inline-block; padding: 6px 14px; font: 500 .875rem/1.4 var(--font);
      border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text); cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-sm { padding: 2px 8px; font-size: .75rem; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); }
    .btn-primary:hover:not(:disabled) { filter: brightness(.92); }
    .btn-outline-primary { color: var(--primary); border-color: var(--primary); }
    .btn-outline-primary:hover:not(:disabled) { background: var(--primary); color: var(--primary-fg); }
    .btn-outline-danger { color: var(--red); border-color: var(--red); }
    .btn-outline-danger:hover:not(:disabled) { background: var(--red); color: #fff; }
    .btn-link { border-color: var(--border); }

    /* Tabella */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 20px; text-align: left; font-size: .625rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--hover); border-bottom: 1px solid var(--border); }
    td { padding: 12px 20px; vertical-align: middle; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: 0; }
    td a { color: var(--primary); text-decoration: none; overflow-wrap: anywhere; }
    td a:hover { text-decoration: underline; }
    .detail { margin: 2px 0 0; font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
    .detail.error { color: var(--red); }
    .detail .mono { font-family: var(--mono); }
    .nowrap-cell { white-space: nowrap; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .625rem; font-weight: 700; letter-spacing: .04em; color: #fff; text-transform: uppercase; }
    .badge.online { background: var(--green); }
    .badge.offline { background: var(--red); }
    .badge.unknown { background: var(--grey); }

    .empty { margin: 0; padding: 40px 20px; text-align: center; color: var(--muted); }
    .empty[hidden], .note[hidden] { display: none; }
    .note { margin: 16px 0 0; padding: 10px 14px; border-left: 3px solid var(--red); background: var(--surface); color: var(--muted); }

    /* Finestra "Aggiungi URL" */
    dialog { width: min(480px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); }
    dialog::backdrop { background: rgba(24,36,51,.5); }
    .dialog-body { padding: 20px; }
    .dialog-body h2 { margin: 0 0 12px; font-size: 1rem; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input[type=text] { width: 100%; padding: 8px 12px; font: .875rem var(--mono); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: .75rem; }
    .form-error { margin: 12px 0 0; color: var(--red); }
    .form-error[hidden] { display: none; }
    .dialog-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--hover); }

    a:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <svg viewBox="0 0 32 32" role="img" aria-label="Logo URL Follower">
        <rect width="32" height="32" rx="8" fill="#066FD1"/>
        <path d="M9 22 L16 16 L23 10" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="9" cy="22" r="3" fill="#fff"/>
        <circle cx="23" cy="10" r="3.5" fill="#F59F00"/>
      </svg>
      <strong>URL Follower</strong>
      <span class="version">v0.3.0</span>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">URL monitorati</h1>
        <div class="card-actions">
          <div class="btn-list">
            <button id="add-url-button" type="button" class="btn btn-primary">Aggiungi URL</button>
            <button id="check-all-button" type="button" class="btn btn-primary">Controlla tutti</button>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>URL</th>
              <th>Stato</th>
              <th>Ultimo controllo</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="url-table-body"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden>Non stai monitorando nessun indirizzo. Premi Aggiungi URL per inserire il primo.</p>
    </div>
    <p class="note" id="note" role="status" hidden></p>
  </main>

  <dialog id="add-url-modal" aria-labelledby="add-title">
    <form id="add-form" method="dialog">
      <div class="dialog-body">
        <h2 id="add-title">Aggiungi URL</h2>
        <label for="new-url">Indirizzo da monitorare</label>
        <input type="text" id="new-url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://esempio.it">
        <p class="hint">Per ogni indirizzo vengono seguiti fino a 10 reindirizzamenti.</p>
        <p class="form-error" id="add-error" role="alert" hidden></p>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn btn-link" id="add-cancel">Annulla</button>
        <button type="submit" class="btn btn-primary" id="add-submit">Aggiungi</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
