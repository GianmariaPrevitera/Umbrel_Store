version: "3.7"

services:

  app_proxy:
    environment:
      # Formato: <app-id>_<nome-servizio-docker>_1
      APP_HOST: gianmaria-url-follower_web_1
      APP_PORT: 8080
      # Il pannello e le API di gestione restano dietro il login di Umbrel.
      # Solo gli indirizzi che iniziano con /api= (elenco in testo semplice) sono pubblici.
      PROXY_AUTH_WHITELIST: "/api=*"

  web:
    # Immagine ufficiale di Python: il codice dell'app è in app/app.py
    image: python:3.12-alpine
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["python", "-u", "/app/app.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WWW_DIR: /www
      DATA_DIR: /data
      # Ogni quanti minuti controllare tutti gli URL (0 = mai)
      CHECK_INTERVAL_MINUTES: "10"
    volumes:
      # Le cartelle app/, www/ e data/ del repo vengono copiate da Umbrel in ${APP_DATA_DIR}
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/www:/www:ro
      # Database degli URL e degli utenti
      - ${APP_DATA_DIR}/data:/data
