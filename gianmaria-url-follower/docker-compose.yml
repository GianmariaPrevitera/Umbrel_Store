version: "3.7"

services:

  app_proxy:
    environment:
      # Formato: <app-id>_<nome-servizio-docker>_1
      APP_HOST: gianmaria-url-follower_web_1
      APP_PORT: 8080
      # L'app deve essere raggiungibile senza il login di Umbrel
      PROXY_AUTH_ADD: "false"

  web:
    # Immagine ufficiale di Python: il codice dell'app è in app/server.py
    image: python:3.12-alpine
    user: "1000:1000"
    init: true
    restart: on-failure
    command: ["python", "-u", "/app/server.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WWW_DIR: /www
    volumes:
      # Le cartelle app/ e www/ del repo vengono copiate da Umbrel in ${APP_DATA_DIR}
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/www:/www:ro
