version: "3.7"

services:

  app_proxy:
    environment:
      # Formato: <app-id>_<nome-servizio-docker>_1
      APP_HOST: gianmaria-url-follower_web_1
      APP_PORT: 8080

  web:
    # nginx senza privilegi di root: ascolta sulla porta 8080
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: on-failure
    volumes:
      # La cartella www/ del repo viene copiata da Umbrel in ${APP_DATA_DIR}
      - ${APP_DATA_DIR}/www:/usr/share/nginx/html:ro