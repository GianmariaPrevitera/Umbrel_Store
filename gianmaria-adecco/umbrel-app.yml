id: gianmaria-adecco
category: automation
name: Adecco
icon: https://raw.githubusercontent.com/GianmariaPrevitera/Umbrel_Store/main/gianmaria-adecco/icon.svg
version: "1.0.2"
tagline: Registro presenze e timbrature su Adecco BadgeBox
description: >-
  Registro mensile delle presenze letto da Adecco BadgeBox, con riepilogo di ore lavorate,
  straordinari, assenze e trasferte.


  Dalla pagina puoi timbrare o eliminare i turni della settimana corrente e inviare il
  timesheet (lunedì-domenica, tagliato a fine mese).


  Dopo l'installazione inserisci USERNAME e PASSWORD di BadgeBox nel file
  ~/umbrel/app-data/gianmaria-adecco/data/.env
