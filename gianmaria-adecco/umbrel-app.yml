tagline: Registro presenze e timbrature su Adecco BadgeBox
description: >-
  aria2 è un download manager leggero e velocissimo, con interfaccia web Aria2 WebUI.


  Supporta HTTP, HTTPS, FTP, SFTP, BitTorrent, magnet link e Metalink, con download multi-connessione e possibilità di scegliere quali file scaricare da un torrent.


  I file vengono salvati nella cartella Downloads di umbrelOS.


  Al primo accesso apri le impostazioni di Aria2 WebUI (Connection Settings) e inserisci come Secret Token la password mostrata da umbrelOS nella pagina dell'app. Al primo avvio vengono scaricati aria2 e l'interfaccia, quindi serve connessione a internet.

releaseNotes: >-
  Credenziali BadgeBox configurabili dalle impostazioni dell'app (variabili d'ambiente BADGEBOX_USERNAME e BADGEBOX_PASSWORD).

