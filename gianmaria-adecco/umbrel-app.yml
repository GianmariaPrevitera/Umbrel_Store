icon: https://raw.githubusercontent.com/GianmariaPrevitera/Umbrel_Store/master/gianmaria-adecco/icon.svg
description: >-
  Registro mensile delle presenze letto da Adecco BadgeBox, con riepilogo di ore lavorate, straordinari, assenze e trasferte.


  Dalla pagina puoi timbrare o eliminare i turni della settimana corrente e inviare il timesheet (da lunedì a domenica, tagliato a fine mese).


  Dopo l'installazione apri le impostazioni dell'app e, in Avanzate, imposta le variabili BADGEBOX_USERNAME e BADGEBOX_PASSWORD con le tue credenziali BadgeBox.
