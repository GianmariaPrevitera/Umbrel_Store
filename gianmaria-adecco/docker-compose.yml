version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gianmaria-adecco_web_1
      APP_PORT: 80

  web:
    image: php:8.3-cli-alpine
    restart: on-failure
    working_dir: /var/www/html
    environment:
      TZ: Europe/Rome
      # Worker del server integrato di PHP: una chiamata lenta a BadgeBox non blocca la pagina.
      PHP_CLI_SERVER_WORKERS: "4"
      # Credenziali BadgeBox: si modificano da umbrelOS, in
      # Impostazioni dell'app > Avanzate > Variabili d'ambiente.
      BADGEBOX_USERNAME: ""
      BADGEBOX_PASSWORD: ""
    volumes:
      # Pagina e backend (index.html + presenze.php), in sola lettura.
      - ${APP_DATA_DIR}/www:/var/www/html:ro
    command: php -S 0.0.0.0:80 -t /var/www/html
