version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gianmaria-adecco_web_1
      APP_PORT: 80

  web:
    image: php:8.3-cli-alpine
    restart: on-failure
    working_dir: /var/www/html
    environment:
      TZ: Europe/Rome
      # Worker del server integrato di PHP: una chiamata lenta a BadgeBox non blocca la pagina.
      PHP_CLI_SERVER_WORKERS: "4"
      # Cartella dove la pagina salva le credenziali BadgeBox (credentials.json).
      DATA_DIR: /data
    volumes:
      # Pagina e backend (index.html + presenze.php), in sola lettura.
      - ${APP_DATA_DIR}/www:/var/www/html:ro
      # Dati persistenti: le credenziali sopravvivono ad aggiornamenti e riavvii.
      - ${APP_DATA_DIR}/data:/data
    command: php -S 0.0.0.0:80 -t /var/www/html
