<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro presenze</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css">

  <style>
    body {
      background: #f5f7fb;
      color: #182433;
      font-size: 14px;
    }

    .navbar-brand {
      font-size: 21px;
      font-weight: 700;
    }

    .page-wrapper {
      min-height: 100vh;
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .month-navigation {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-title {
      min-width: 115px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }

    /* Riepilogo: cinque box */
    .summary-card {
      height: 100%;
    }

    .summary-card .card-body {
      padding: 16px 18px;
    }

    .summary-label {
      color: #667382;
      font-size: 12px;
      line-height: 1.5;
    }

    .summary-value {
      margin-top: 7px;
      font-size: clamp(19px, 2vw, 25px);
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
    }


    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .attendance-table {
      margin-bottom: 0;
    }

    .attendance-table thead th {
      padding: 15px 18px;
      background: #fbfcfd;
      color: #667382;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .attendance-table tbody td {
      padding: 20px 18px;
      vertical-align: middle;
      border-color: #e9edf2;
    }

    .day-cell {
      width: 185px;
      min-width: 160px;
      color: #354052;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .punches-cell {
      min-width: 400px;
      width: auto;
    }

    .punch-grid {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(180px, 1fr);
      column-gap: 24px;
      row-gap: 12px;
      max-width: 680px;
    }

    .punch {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 18px;
      font-size: 14px;
      color: #354052;
      white-space: nowrap;
    }

    .punch-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
    }

    .dot-green { background: #2fb344; }
    .dot-red { background: #d63939; }
    .dot-yellow { background: #e6a700; }
    .dot-blue   { background: #206bc4; }
    .dot-purple { background: #ae3ec9; }

    .punch-dot.dot-blue {
      margin-left: -14px;
      margin-right: 6px;
      position: relative;
      outline: 2px solid #fff;
    }

    .day-notes {
      margin-top: 15px;
      padding-top: 10px;
      color: #667382;
      font-size: 12px;
      line-height: 1.5;
    }

    .day-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.6;
    }

    .tag-red {
      background: #fbe9e9;
      color: #a83232;
    }

    .tag-yellow {
      background: #fff0c2;
      color: #946200;
    }

    .tag-blue {
      background: #e5efff;
      color: #205bb2;
    }

    .tag-green {
      background: #dff7e5;
      color: #20763a;
    }

    .tag-purple {
      background: #f5e6fa;
      color: #7a2b94;
    }

    .hours-cell {
      width: 135px;
      min-width: 120px;
      text-align: center;
      white-space: nowrap;
    }

    .hours-total {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.8;
      color: #354052;
    }

    .hours-overtime {
      color: #206bc4;
    }

    .empty-day {
      color: #b8c0cc;
    }


.year-value {
  min-width: 58px;
  margin-right: 4px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  line-height: 24px;
  font-variant-numeric: tabular-nums;
}



    @media (max-width: 767px) {
      .page-body {
        padding: 15px 8px;
      }

      .calendar-toolbar {
        gap: 12px;
      }

      .month-navigation {
        flex-wrap: wrap;
        gap: 6px;
      }

      .month-title {
        min-width: 100px;
        font-size: 18px;
      }

      .summary-card .card-body {
        padding: 13px;
      }

      .summary-value {
        font-size: 21px;
      }


      .attendance-table tbody td {
        padding: 15px 12px;
      }

      .punches-cell {
        min-width: 390px;
      }

      .punch-grid {
        grid-template-columns: 1fr 1fr;
        column-gap: 12px;
      }

      .day-cell {
        min-width: 140px;
        width: 140px;
      }

      .hours-cell {
        min-width: 100px;
      }
    }

    /* Riga della settimana corrente con il bottone del timesheet */
    .week-row td {
      padding: 12px 18px;
      background: #f1f5fb;
      border-color: #e9edf2;
    }

    .week-row-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      color: #354052;
      font-size: 13px;
      font-weight: 600;
    }

    /* Form di timbratura */
    .actions-cell { width: 96px; min-width: 96px; text-align: center; white-space: nowrap; }

    /* SweetAlert2: font e pulsanti coerenti con la pagina */
    .swal2-popup { font-size: 14px; }
    .swal2-title { font-size: 20px; font-weight: 600; }
    .swal2-html-container { overflow: visible; }
    .swal2-validation-message { justify-content: flex-start; }
    .swal2-actions { gap: 8px; }
    .swal2-actions .btn { margin: 0; }
  </style>
</head>

<body>
<div class="page">

  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <h1 class="navbar-brand mb-0">Timbratura</h1>

      <div class="navbar-nav flex-row ms-auto">
        <div class="nav-item me-2">
          <button type="button" class="btn btn-icon btn-ghost-secondary" id="configBtn"
            title="Credenziali BadgeBox" aria-label="Credenziali BadgeBox">
            <i class="ti ti-settings"></i>
          </button>
        </div>
        <div class="nav-item">
          <span class="nav-link d-flex align-items-center gap-2">
            <span class="avatar avatar-sm bg-blue-lt" id="userInitials"></span>
            <span id="userName"></span>
          </span>
        </div>
      </div>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">

        <!-- Navigazione mese e anno -->
        <div class="calendar-toolbar">
          <div class="month-navigation">

            <button class="btn btn-icon btn-ghost-secondary"
              id="prevMonth"
              aria-label="Mese precedente">
              <i class="ti ti-chevron-left"></i>
            </button>

            <span class="month-title" id="monthTitle">Ottobre</span>



            <span id="yearValue" class="year-value">2026</span>

            <button class="btn btn-icon btn-ghost-secondary"
              id="nextMonth"
              aria-label="Mese successivo">
              <i class="ti ti-chevron-right"></i>
            </button>


          </div>

          <button class="btn btn-outline-secondary" id="todayBtn">
            <i class="ti ti-calendar me-1"></i>
            Vai a oggi
          </button>
        </div>

        <!-- Errori di lettura dati -->
        <div id="errorBox"></div>

        <!-- Cinque box riepilogativi -->
        <div class="row row-cards mb-3">

          <!-- Ore lavorate -->
          <div class="col-6 col-md-4 col-xl">
            <div class="card summary-card">
              <div class="card-body">
                <div class="summary-header">
                  <div class="summary-label">Ore lavorate</div>
                </div>
                <div class="summary-value" id="workedHours">0h 00m</div>
              </div>
            </div>
          </div>

          <!-- Ore assenza -->
          <div class="col-6 col-md-4 col-xl">
            <div class="card summary-card">
              <div class="card-body">
                <div class="summary-header">
                  <div class="summary-label">Ore assenza</div>
                </div>
                <div class="summary-value text-danger" id="absenceHours">
                  0h 00m
                </div>
              </div>
            </div>
          </div>

          <!-- Ore straordinario -->
          <div class="col-6 col-md-4 col-xl">
            <div class="card summary-card">
              <div class="card-body">
                <div class="summary-header">
                  <div class="summary-label">Ore straordinario</div>
                </div>
                <div class="summary-value text-primary" id="overtimeHours">
                  0h 00m
                </div>
              </div>
            </div>
          </div>

          <!-- Giorni trasferta -->
          <div class="col-6 col-md-6 col-xl">
            <div class="card summary-card">
              <div class="card-body">
                <div class="summary-header">
                  <div class="summary-label">Giorni trasferta</div>
                </div>
                <div class="summary-value text-warning" id="travelDays">0</div>
              </div>
            </div>
          </div>

          <!-- Totale economico, per ora fisso -->
          <div class="col-12 col-md-6 col-xl">
            <div class="card summary-card">
              <div class="card-body">
                <div class="summary-header">
                  <div class="summary-label">Tot</div>
                </div>
                <div class="summary-value" id="totalAmount">0 €</div>
              </div>
            </div>
          </div>

        </div>

        <!-- Tabella presenze -->
        <div class="card">
          <div class="table-responsive">
            <table class="table table-vcenter attendance-table">
              <thead>
                <tr>
                  <th>Giorno</th>
                  <th>Timbrature</th>
                  <th class="text-center">Ore</th>
                  <th class="text-center">Azioni</th>
                </tr>
              </thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>


        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script>
  const monthNames = [
    "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
    "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
  ];

  const dayNames = [
    "DOMENICA", "LUNEDÌ", "MARTEDÌ", "MERCOLEDÌ", "GIOVEDÌ", "VENERDÌ", "SABATO"
  ];

  // Soglia ordinaria: 8 ore al giorno.
  const ORDINARY_DAILY_MINUTES = 8 * 60;

  // Orari proposti nel form di timbratura.
  const DEFAULT_TIMES = { checkin: "09:00", pause_in: "13:00", pause_out: "14:00", checkout: "18:00" };

  // Tariffe orarie per l'importo del mese: ore ordinarie e assenze / straordinario.
  const HOURLY_RATE = 10.02397032;
  const OVERTIME_RATE = 4.3625;

  // Dati del mese visualizzato (in modalità normale arrivano dal server).
  let attendance = {};

  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();

  const el = id => document.getElementById(id);
  const body = el("attendanceBody");

  const pad2 = value => String(value).padStart(2, "0");

  // Indirizzo di un'azione del server: presenze.php, nella stessa cartella della pagina.
  const apiUrl = (action, params = {}) => `presenze.php?${new URLSearchParams({ a: action, ...params })}`;

  /* ------------------------------------------------------------------------
   * SweetAlert2 con i pulsanti di Tabler
   * ---------------------------------------------------------------------- */

  const swalClasses = (confirm = "btn btn-primary") => ({
    confirmButton: confirm,
    cancelButton: "btn btn-link link-secondary"
  });

  // Form e conferme.
  const Dialog = Swal.mixin({
    buttonsStyling: false,
    reverseButtons: true,
    cancelButtonText: "Annulla",
    customClass: swalClasses()
  });

  // Notifiche non bloccanti in alto a destra.
  const Toast = Swal.mixin({
    toast: true,
    position: "top-end",
    showConfirmButton: false,
    timer: 3500,
    timerProgressBar: true
  });

  const notify = message => Toast.fire({ icon: "success", title: message });

  const errorText = error => (error && error.message) || String(error);

  const notifyError = (prefix, error) =>
    Toast.fire({ icon: "error", title: `${prefix}: ${errorText(error)}`, timer: 7000 });

  /* ------------------------------------------------------------------------
   * Utilità
   * ---------------------------------------------------------------------- */

  // Protegge le stringhe inserite nell'HTML.
  const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => HTML_ESCAPES[char]);
  }

  /*
   * Tipi di timbratura. Il server manda `type`: l'id_track_voice di BadgeBox
   * ("-1" regolare, "251" smart working, "252" trasferta) oppure "absence" per le assenze.
   * Un tipo sconosciuto è trattato come regolare.
   */
  const REGULAR_TYPE = { label: "Regolare", color: "green" };

  const PUNCH_TYPES = {
    "-1": REGULAR_TYPE,
    "251": { label: "Smart working", color: "purple" },
    "252": { label: "Trasferta", color: "yellow" },
    "absence": { label: "Assenza", color: "red" }
  };

  const OVERTIME_TYPE = { label: "Straordinario", color: "blue" };

  const punchType = punch => PUNCH_TYPES[String(punch.type)] || REGULAR_TYPE;

  // Le assenze non sono ore lavorate.
  const isAbsence = punch => String(punch.type) === "absence";

  const isTravel = punch => String(punch.type) === "252";

  // Converte HH:MM in minuti (null se l'orario non è valido).
  function timeToMinutes(time) {
    const match = /^(\d{1,2}):(\d{2})$/.exec(time);
    const hours = match && Number(match[1]);
    const minutes = match && Number(match[2]);

    return match && hours <= 23 && minutes <= 59 ? hours * 60 + minutes : null;
  }

  // Durata di un intervallo "HH:MM - HH:MM", anche oltre mezzanotte.
  function calculatePunchMinutes(punch) {
    const match = /^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/.exec(String(punch.time || "").trim());
    const start = match && timeToMinutes(match[1]);
    const end = match && timeToMinutes(match[2]);

    if (start === null || end === null || !match) {
      console.warn("Intervallo non valido:", punch.time);
      return 0;
    }

    return end < start ? end + 24 * 60 - start : end - start;
  }

  /*
   * Riepilogo di una giornata, calcolato una sola volta:
   * ore ordinarie (max 8), straordinario, assenze, timbratura valida più lunga
   * (per il pallino blu dello straordinario) e se ci sono turni / trasferte.
   */
  function summarizeDay(punches) {
    let total = 0;
    let absence = 0;
    let longest = null;

    for (const punch of punches) {
      const minutes = calculatePunchMinutes(punch);

      if (isAbsence(punch)) {
        absence += minutes;
      } else {
        total += minutes;

        if (!longest || minutes > longest.minutes) {
          longest = { punch, minutes };
        }
      }
    }

    return {
      ordinary: Math.min(total, ORDINARY_DAILY_MINUTES),
      overtime: Math.max(0, total - ORDINARY_DAILY_MINUTES),
      absence,
      longest: longest && longest.punch,
      hasShifts: punches.some(punch => !isAbsence(punch)),
      isTravelDay: punches.some(isTravel)
    };
  }

  // Formatta i minuti come "8h 00m".
  const formatHours = minutes => `${Math.floor(minutes / 60)}h ${pad2(minutes % 60)}m`;

  // Badge della giornata (tutti i tipi tranne "Regolare", più lo straordinario).
  function generateTags(punches, overtimeMinutes) {
    const types = new Set(punches.map(punchType).filter(type => type !== REGULAR_TYPE));

    if (overtimeMinutes > 0) {
      types.add(OVERTIME_TYPE);
    }

    return [...types].map(type =>
      `<span class="tag tag-${type.color}">${escapeHtml(type.label)}</span>`
    ).join("");
  }

  const toIso = date => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  const toItalianDate = iso => iso.split("-").reverse().join("/");

  /* ------------------------------------------------------------------------
   * Tabella e riepilogo del mese
   * ---------------------------------------------------------------------- */

  function updateToolbar() {
    el("monthTitle").textContent = monthNames[currentMonth];
    el("yearValue").textContent = currentYear;
  }

  const EMPTY_CELL = '<span class="empty-day">—</span>';

  function dayRow(date, punchesHtml, hoursHtml, actionsHtml) {
    return `
      <tr>
        <td class="day-cell">${dayNames[date.getDay()]} ${pad2(date.getDate())}</td>
        <td class="punches-cell">${punchesHtml}</td>
        <td class="hours-cell">${hoursHtml}</td>
        ${actionsHtml}
      </tr>`;
  }

  function punchesHtml(punches, day) {
    return punches.map(punch => {
      const showOvertimeDot = day.overtime > 0 && day.longest === punch;

      return `
        <div class="punch">
          <span class="punch-dot dot-${punchType(punch).color}"></span>
          ${showOvertimeDot ? '<span class="punch-dot dot-blue" title="Straordinario"></span>' : ""}
          <span>${escapeHtml(punch.time || "")}</span>
        </div>`;
    }).join("");
  }

  function hoursHtml(day) {
    return `
      <div class="hours-total">${formatHours(day.ordinary)}</div>
      ${day.overtime > 0
        ? `<div class="hours-total hours-overtime">+ ${formatHours(day.overtime)}</div>`
        : ""}
      ${day.absence > 0
        ? `<div class="hours-total" style="color: #d63939;">${formatHours(day.absence)}</div>`
        : ""}`;
  }

  function renderCalendar() {
    updateToolbar();

    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const week = currentWeek();
    const totals = { worked: 0, overtime: 0, absence: 0, travelDays: 0 };
    const rows = [];

    for (let dayOfMonth = 1; dayOfMonth <= daysInMonth; dayOfMonth++) {
      const date = new Date(currentYear, currentMonth, dayOfMonth);
      const record = attendance[`${currentYear}-${currentMonth + 1}-${dayOfMonth}`];

      // La riga del timesheet va dopo l'ultimo giorno del periodo (domenica o fine mese).
      const iso = toIso(date);
      const endsWeek = iso === week.tsEnd;

      if (!record) {
        rows.push(dayRow(date, EMPTY_CELL, EMPTY_CELL, actionCell(date, false, week)));
        if (endsWeek) rows.push(weekRow(week));
        continue;
      }

      const punches = Array.isArray(record.punches) ? record.punches : [];
      const day = summarizeDay(punches);
      const tags = generateTags(punches, day.overtime);

      totals.worked += day.ordinary;
      totals.overtime += day.overtime;
      totals.absence += day.absence;
      totals.travelDays += day.isTravelDay ? 1 : 0;

      const notes = record.note || tags ? `
        <div class="day-notes">
          ${tags ? `<div class="day-tags">${tags}</div>` : ""}
          ${record.note ? `<div>${escapeHtml(record.note)}</div>` : ""}
        </div>` : "";

      rows.push(dayRow(
        date,
        `<div class="punch-grid">${punchesHtml(punches, day)}</div>${notes}`,
        hoursHtml(day),
        actionCell(date, day.hasShifts, week)
      ));

      if (endsWeek) rows.push(weekRow(week));
    }

    body.innerHTML = rows.join("");

    const amount =
      ((totals.worked + totals.absence) / 60) * HOURLY_RATE +
      (totals.overtime / 60) * OVERTIME_RATE;

    setSummary({
      workedHours: formatHours(totals.worked),
      absenceHours: formatHours(totals.absence),
      overtimeHours: formatHours(totals.overtime),
      travelDays: totals.travelDays,
      totalAmount: `${amount.toLocaleString("it-IT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })} €`
    });
  }

  const SUMMARY_IDS = ["workedHours", "absenceHours", "overtimeHours", "travelDays", "totalAmount"];

  function setSummary(values) {
    SUMMARY_IDS.forEach(id => {
      el(id).textContent = values ? values[id] : "—";
    });
  }

  /* ------------------------------------------------------------------------
   * Lettura dei dati dal server (presenze.py)
   * ---------------------------------------------------------------------- */

  let loadToken = 0;

  // Fetch che restituisce il JSON e solleva un errore leggibile se la risposta non è ok.
  async function fetchJson(url, options) {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => null);

    if (!response.ok) {
      const error = new Error((data && data.error) || `errore ${response.status}`);

      error.status = response.status;
      throw error;
    }

    return data;
  }

  const postJson = (url, payload) => fetchJson(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  function setUser(user) {
    const name = user && user.name ? String(user.name) : "";
    const surname = user && user.surname ? String(user.surname) : "";

    el("userName").textContent = `${name} ${surname}`.trim();
    el("userInitials").textContent = ((name[0] || "") + (surname[0] || "")).toUpperCase();
  }

  function showMessageRow(html) {
    body.innerHTML = `
      <tr>
        <td colspan="4" class="text-center text-secondary py-5">${html}</td>
      </tr>`;
  }

  function showError(message, prefix = "Impossibile leggere i dati") {
    el("errorBox").innerHTML = `
      <div class="alert alert-danger" role="alert">
        ${escapeHtml(prefix)}: ${escapeHtml(message)}
      </div>`;
  }

  // Carica il mese selezionato e ridisegna la pagina.
  async function loadMonth() {
    const token = ++loadToken;

    updateToolbar();
    el("errorBox").innerHTML = "";

    showMessageRow('<span class="spinner-border spinner-border-sm me-2"></span>Caricamento…');

    try {
      const data = await fetchJson(
        apiUrl("dati", { mese: `${currentYear}-${pad2(currentMonth + 1)}` }),
        { cache: "no-store" }
      );

      if (token !== loadToken) {
        return;
      }

      attendance = data.attendance || {};
      setUser(data.user);
      renderCalendar();
    } catch (error) {
      if (token !== loadToken) {
        return;
      }

      attendance = {};
      setSummary(null);

      // 409: credenziali BadgeBox non ancora salvate, si apre il form di configurazione.
      if (error.status === 409) {
        showMessageRow("Credenziali BadgeBox non configurate");
        openConfigDialog();
        return;
      }

      showMessageRow("Dati non disponibili");
      showError(error.message || String(error));
    }
  }

  // Navigazione mensile.
  function goToMonth(delta) {
    const target = new Date(currentYear, currentMonth + delta, 1);

    currentYear = target.getFullYear();
    currentMonth = target.getMonth();
    loadMonth();
  }

  el("prevMonth").addEventListener("click", () => goToMonth(-1));
  el("nextMonth").addEventListener("click", () => goToMonth(1));

  el("todayBtn").addEventListener("click", () => {
    const today = new Date();

    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    loadMonth();
  });

  /* ------------------------------------------------------------------------
   * Timbra o elimina un giorno (il server inoltra la richiesta a BadgeBox)
   * ---------------------------------------------------------------------- */

  // Settimana corrente (lunedì-domenica) e oggi, nel formato YYYY-MM-DD.
  function currentWeek() {
    const now = new Date();
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);

    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);

    // Periodo del timesheet: lunedì-domenica, ma senza uscire dal mese di oggi (fine mese a metà settimana).
    const tsStart = toIso(monday) > toIso(monthStart) ? toIso(monday) : toIso(monthStart);
    const tsEnd = toIso(sunday) < toIso(monthEnd) ? toIso(sunday) : toIso(monthEnd);

    return { start: toIso(monday), end: toIso(sunday), tsStart, tsEnd, today: toIso(now) };
  }

  const shortDate = iso => toItalianDate(iso).slice(0, 5);

  // Riga con il bottone che invia il timesheet della settimana corrente (lunedì-domenica).
  function weekRow(week) {
    return `
      <tr class="week-row d-print-none">
        <td colspan="4">
          <div class="week-row-inner">
            <span><i class="ti ti-calendar-week me-1"></i>Timesheet: ${shortDate(week.tsStart)} – ${shortDate(week.tsEnd)}</span>
            <button type="button" class="btn btn-sm btn-primary act-timesheet"
              data-from="${week.tsStart}" data-to="${week.tsEnd}">
              <i class="ti ti-send me-1"></i>Invia timesheet
            </button>
          </div>
        </td>
      </tr>`;
  }

  async function sendTimesheet(button) {
    const label = `${shortDate(button.dataset.from)} – ${shortDate(button.dataset.to)}`;

    const answer = await Dialog.fire({
      icon: "question",
      title: "Inviare il timesheet?",
      text: `Periodo: ${label}`,
      showCancelButton: true,
      confirmButtonText: "Invia",
      focusCancel: true
    });

    if (!answer.isConfirmed) {
      return;
    }

    button.disabled = true;

    try {
      const result = await postJson(apiUrl("timesheet"), {});

      notify(result.messaggio || "Timesheet inviato.");
    } catch (error) {
      notifyError("Invio timesheet non riuscito", error);
    } finally {
      button.disabled = false;
    }
  }

  /*
   * Cella delle azioni, solo per i giorni della settimana corrente:
   * + (timbra) fino a oggi compreso, non si può anticipare; x (elimina i turni) se il giorno ne ha.
   * Fuori dalla settimana corrente resta vuota.
   */
  function actionCell(date, hasShifts, week) {
    const iso = toIso(date);
    const canAdd = iso <= week.today;

    if (iso < week.start || iso > week.end || (!canAdd && !hasShifts)) {
      return '<td class="actions-cell"></td>';
    }

    return `
      <td class="actions-cell d-print-none">
        <div class="btn-list flex-nowrap justify-content-center">
          ${canAdd ? `
          <button type="button" class="btn btn-icon btn-sm btn-primary act-add"
            data-date="${iso}" title="Timbra questo giorno" aria-label="Timbra">
            <i class="ti ti-plus"></i>
          </button>` : ""}
          ${hasShifts ? `
          <button type="button" class="btn btn-icon btn-sm btn-danger act-del"
            data-date="${iso}" title="Elimina i turni di questo giorno" aria-label="Elimina">
            <i class="ti ti-trash"></i>
          </button>` : ""}
        </div>
      </td>`;
  }

  // Form di timbratura mostrato dentro SweetAlert2.
  const STAMP_FORM_HTML = `
    <div class="text-start">
      <div class="mb-3">
        <label class="form-label" for="stampType">Tipo</label>
        <select class="form-select" id="stampType">
          <option value="-1">Regolare</option>
          <option value="251">Smart working</option>
          <option value="252">Trasferta</option>
        </select>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="form-label" for="stampIn">Ingresso</label>
          <input class="form-control" type="time" id="stampIn">
        </div>
        <div class="col-6">
          <label class="form-label" for="stampOut">Uscita</label>
          <input class="form-control" type="time" id="stampOut">
        </div>
        <div class="col-6">
          <label class="form-label" for="stampPauseIn">Inizio pausa</label>
          <input class="form-control" type="time" id="stampPauseIn">
        </div>
        <div class="col-6">
          <label class="form-label" for="stampPauseOut">Fine pausa</label>
          <input class="form-control" type="time" id="stampPauseOut">
        </div>
      </div>

      <label class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="stampNoPause">
        <span class="form-check-label">Senza pausa</span>
      </label>

      <div class="mb-3">
        <label class="form-label" for="stampNote">Nota</label>
        <input class="form-control" type="text" id="stampNote" maxlength="200" autocomplete="off">
      </div>

      <div class="text-secondary small">
        Eventuali turni già presenti in questo giorno vengono sostituiti.
      </div>
    </div>`;

  function setNoPause(noPause) {
    el("stampNoPause").checked = noPause;
    el("stampPauseIn").disabled = noPause;
    el("stampPauseOut").disabled = noPause;
  }

  async function openStampDialog(iso) {
    const result = await Dialog.fire({
      title: `Timbratura del ${toItalianDate(iso)}`,
      html: STAMP_FORM_HTML,
      showCancelButton: true,
      confirmButtonText: "Salva",
      focusConfirm: false,
      showLoaderOnConfirm: true,
      allowOutsideClick: () => !Swal.isLoading(),

      didOpen: () => {
        el("stampIn").value = DEFAULT_TIMES.checkin;
        el("stampPauseIn").value = DEFAULT_TIMES.pause_in;
        el("stampPauseOut").value = DEFAULT_TIMES.pause_out;
        el("stampOut").value = DEFAULT_TIMES.checkout;
        setNoPause(false);
        el("stampNoPause").addEventListener("change", event => setNoPause(event.target.checked));
      },

      preConfirm: async () => {
        const checkin = el("stampIn").value;
        const checkout = el("stampOut").value;
        const noPause = el("stampNoPause").checked;
        const pauseIn = el("stampPauseIn").value;
        const pauseOut = el("stampPauseOut").value;

        if (!checkin || !checkout || (!noPause && (!pauseIn || !pauseOut))) {
          Swal.showValidationMessage("Compila tutti gli orari.");
          return;
        }

        const fasce = noPause
          ? [`${checkin}-${checkout}`]
          : [`${checkin}-${pauseIn}`, `${pauseOut}-${checkout}`];

        try {
          return await postJson(apiUrl("timbra"), {
            data: iso,
            tipo: el("stampType").value,
            fasce,
            nota: el("stampNote").value.trim()
          });
        } catch (error) {
          Swal.showValidationMessage(escapeHtml(errorText(error)));
        }
      }
    });

    if (result.isConfirmed) {
      notify((result.value && result.value.messaggio) || "Timbratura inviata.");
      loadMonth();
    }
  }

  async function deleteDay(button) {
    const iso = button.dataset.date;

    const answer = await Dialog.fire({
      icon: "warning",
      title: "Eliminare i turni?",
      text: `Verranno eliminati tutti i turni del ${toItalianDate(iso)}.`,
      showCancelButton: true,
      confirmButtonText: "Elimina",
      focusCancel: true,
      customClass: swalClasses("btn btn-danger")
    });

    if (!answer.isConfirmed) {
      return;
    }

    button.disabled = true;

    try {
      await postJson(apiUrl("elimina-giorno"), { data: iso });
      notify(`Turni del ${toItalianDate(iso)} eliminati.`);
      loadMonth();
    } catch (error) {
      button.disabled = false;
      notifyError("Eliminazione non riuscita", error);
    }
  }

  body.addEventListener("click", event => {
    const add = event.target.closest(".act-add");
    const del = event.target.closest(".act-del");
    const timesheet = event.target.closest(".act-timesheet");

    if (timesheet) {
      sendTimesheet(timesheet);
    } else if (add) {
      openStampDialog(add.dataset.date);
    } else if (del) {
      deleteDay(del);
    }
  });

  /* ------------------------------------------------------------------------
   * Credenziali BadgeBox (salvate sul server, la password non torna mai al browser)
   * ---------------------------------------------------------------------- */

  const CONFIG_FORM_HTML = `
    <div class="text-start">
      <div class="mb-3">
        <label class="form-label" for="configUser">Username</label>
        <input class="form-control" type="text" id="configUser" maxlength="200"
          autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="mb-3">
        <label class="form-label" for="configPass">Password</label>
        <input class="form-control" type="password" id="configPass" maxlength="200"
          autocomplete="new-password">
      </div>

      <div class="text-secondary small">
        Prima di salvare si prova un accesso a BadgeBox. La password resta sul server e non viene mai mostrata.
      </div>
    </div>`;

  async function openConfigDialog() {
    if (Swal.isVisible()) {
      return;
    }

    let configured = false;

    const result = await Dialog.fire({
      title: "Credenziali BadgeBox",
      html: CONFIG_FORM_HTML,
      showCancelButton: true,
      confirmButtonText: "Salva",
      focusConfirm: false,
      showLoaderOnConfirm: true,
      allowOutsideClick: () => !Swal.isLoading(),

      didOpen: async () => {
        try {
          const status = await fetchJson(apiUrl("config"), { cache: "no-store" });

          el("configUser").value = status.username || "";

          // Con credenziali già salvate la password si può lasciare vuota (resta quella attuale).
          configured = Boolean(status.configurata);
          el("configPass").placeholder = configured ? "Lascia vuota per non cambiarla" : "";
        } catch (error) {
          Swal.showValidationMessage(escapeHtml(errorText(error)));
        }
      },

      preConfirm: async () => {
        const username = el("configUser").value.trim();
        const password = el("configPass").value;

        if (!username || (!configured && !password)) {
          Swal.showValidationMessage("Inserisci username e password.");
          return;
        }

        try {
          return await postJson(apiUrl("config-salva"), { username, password });
        } catch (error) {
          Swal.showValidationMessage(escapeHtml(errorText(error)));
        }
      }
    });

    if (result.isConfirmed) {
      notify("Credenziali salvate.");
      loadMonth();
    }
  }

  el("configBtn").addEventListener("click", openConfigDialog);

  // Primo caricamento.
  loadMonth();
</script>
</body>
</html>
